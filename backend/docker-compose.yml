services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auco-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: auco
      POSTGRES_PASSWORD: auco
      POSTGRES_DB: auco
    volumes:
      - auco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auco -d auco"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auco-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - auco_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auco_pgdata:
  auco_redis:
